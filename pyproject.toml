[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-travel-agent"
version = "0.1.0"
description = "Personal Travel Planning Agent (capstone POC): LangGraph multi-agent planner over MCP tools with a local web chat"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.165,<1",
  "httpx>=0.27,<1",
  "langchain-mcp-adapters>=0.3.2,<0.4",
  "langchain-openai>=1.8,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "mcp>=1.30,<2",
  "pydantic>=2.7,<3",
  "uvicorn>=0.31",
]

[project.scripts]
travel-agent = "travel_agent.main:serve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
travel_agent = ["mcp_tool_registry.json", "data/*.csv", "web/static/*"]
